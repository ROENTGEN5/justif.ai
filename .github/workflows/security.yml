name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -r app -ll -q
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt
      - name: Security + regression tests
        env:
          PYTHONPATH: ".:tests"
          SUPABASE_JWT_SECRET: ci-placeholder-secret
          RATE_LIMIT: 30/minute
        run: >
          python -m unittest
          tests.test_security tests.test_chat_pipeline tests.test_chat_trust
          tests.test_document_pipeline tests.test_grounding tests.test_relevance
          tests.test_response_planning tests.test_section_evidence
          tests.test_law_lookup tests.test_retrieval tests.test_evaluation
          tests.test_capstone_eval tests.test_stream_eval tests.test_performance
          tests.test_corpus_identity tests.test_refresh_corpus tests.test_cpu_embeddings
          tests.test_versioned_index

  mobile-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm ci
      - name: Check mobile types, lint, stream recovery, cache isolation, and accessibility
        run: |
          npm run lint
          npx tsc --noEmit
          node scripts/test-stream.cjs
          node scripts/test-cache.cjs
          node scripts/test-auth.cjs
          node scripts/test-refresh.cjs
          node scripts/test-drawer.cjs
          node scripts/test-guided-a11y.cjs
          node scripts/test-citations.cjs
      - name: npm audit (runtime deps)
        # Non-blocking until the existing Expo toolchain advisories are resolved.
        # Tighten to `--audit-level=high` once `npm audit` is clean.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Check bundle source for server-side secrets
        run: |
          if grep -rEn "service_role|SUPABASE_JWT_SECRET|DEEPSEEK_API_KEY|PINECONE_API_KEY|sk-[A-Za-z0-9]{20,}" \
               --include=*.ts --include=*.tsx --include=*.js --include=*.json \
               --exclude-dir=node_modules --exclude=package-lock.json . ; then
            echo "::error::Possible server-side secret referenced in mobile source"; exit 1
          fi
